[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claimfence"
version = "0.1.0"
description = "A deterministic linter for evidence-bound claims in technical documentation."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Dean Egan"}]
keywords = ["documentation", "lint", "security", "ai-safety", "assurance", "markdown"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Documentation",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Dean00dev/claimfence"
Issues = "https://github.com/Dean00dev/claimfence/issues"

[project.scripts]
claimfence = "claimfence.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
