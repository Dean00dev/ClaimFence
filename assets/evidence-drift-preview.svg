<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">ClaimFence Evidence Drift preview</title>
  <desc id="desc">A dark deterministic receipt showing three claim and evidence changes, two requiring review.</desc>
  <defs>
    <linearGradient id="drift-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111b"/>
      <stop offset="1" stop-color="#12263a"/>
    </linearGradient>
    <linearGradient id="drift-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#20d9ff"/>
      <stop offset="1" stop-color="#a98bff"/>
    </linearGradient>
    <filter id="drift-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" rx="28" fill="url(#drift-bg)"/>
  <circle cx="1120" cy="-45" r="280" fill="#a98bff" opacity=".055"/>
