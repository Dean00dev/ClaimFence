<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">ClaimFence Evidence Map preview</title>
  <desc id="desc">A dark dashboard mapping three assurance claims from the Doorknob README to missing scope and evidence.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111b"/>
      <stop offset="1" stop-color="#10283a"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" rx="28" fill="url(#bg)"/>
  <circle cx="1090" cy="-25" r="260" fill="#20d9ff" opacity=".05"/>
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <g transform="translate(58 47)">
      <rect width="66" height="66" rx="18" fill="#0e2635" stroke="#2e6076"/>
      <path d="M33 14 52 23v14c0 12-8 21-19 27C22 58 14 49 14 37V23z" fill="none" stroke="#20d9ff" stroke-width="4" filter="url(#glow)"/>
      <path d="m24 37 6 6 13-16" fill="none" stroke="#55e39b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="146" y="71" fill="#20d9ff" font-size="15" font-weight="800" letter-spacing="2">CLAIMFENCE v0.4.0</text>
    <text x="146" y="109" fill="#eef7ff" font-size="38" font-weight="800">Evidence Map</text>
    <text x="58" y="153" fill="#9eb2c7" font-size="17">Dogfood scan · Doorknob README · lexical review, not a factual audit</text>

    <g transform="translate(58 181)">
      <g><rect width="170" height="82" rx="14" fill="#0d1b2a" stroke="#24364a"/><text x="18" y="28" fill="#9eb2c7" font-size="13">CLAIMS</text><text x="18" y="62" fill="#eef7ff" font-size="30" font-weight="800">3</text></g>
      <g transform="translate(184)"><rect width="170" height="82" rx="14" fill="#0d1b2a" stroke="#24364a"/><text x="18" y="28" fill="#9eb2c7" font-size="13">LINKED</text><text x="18" y="62" fill="#55e39b" font-size="30" font-weight="800">0</text></g>
      <g transform="translate(368)"><rect width="170" height="82" rx="14" fill="#0d1b2a" stroke="#725a27"/><text x="18" y="28" fill="#9eb2c7" font-size="13">NEEDS REVIEW</text><text x="18" y="62" fill="#ffca6a" font-size="30" font-weight="800">3</text></g>
      <g transform="translate(552)"><rect width="170" height="82" rx="14" fill="#0d1b2a" stroke="#24364a"/><text x="18" y="28" fill="#9eb2c7" font-size="13">ANCHORS</text><text x="18" y="62" fill="#eef7ff" font-size="30" font-weight="800">0</text></g>
      <g transform="translate(736)"><rect width="348" height="82" rx="14" fill="#2a2112" stroke="#725a27"/><text x="18" y="29" fill="#ffca6a" font-size="13" font-weight="800">INTERPRETATION BOUNDARY</text><text x="18" y="55" fill="#ffe2a1" font-size="13">“Linked” never means proven or sufficient.</text></g>
    </g>

    <g transform="translate(58 283)">
      <g>
        <rect width="1084" height="86" rx="13" fill="#0d1b2a" stroke="#34475b"/>
        <rect width="5" height="86" rx="3" fill="#ffca6a"/>
        <rect x="20" y="15" width="57" height="23" rx="11" fill="none" stroke="#7890a6"/><text x="33" y="31" fill="#bcd2e8" font-size="11" font-weight="800">CF003</text>
        <text x="91" y="32" fill="#eef7ff" font-size="16" font-weight="700">The browser never receives a model-provider API key.</text>
        <text x="91" y="60" fill="#9eb2c7" font-size="13">README.md:18 · missing evidence · missing scope</text>
        <rect x="930" y="25" width="126" height="34" rx="17" fill="#2a2112" stroke="#ffca6a"/><text x="951" y="47" fill="#ffca6a" font-size="12" font-weight="800">NEEDS REVIEW</text>
      </g>
      <g transform="translate(0 98)">
        <rect width="1084" height="86" rx="13" fill="#0d1b2a" stroke="#34475b"/>
        <rect width="5" height="86" rx="3" fill="#ffca6a"/>
        <rect x="20" y="15" width="57" height="23" rx="11" fill="none" stroke="#7890a6"/><text x="33" y="31" fill="#bcd2e8" font-size="11" font-weight="800">CF003</text>
        <text x="91" y="32" fill="#eef7ff" font-size="16" font-weight="700">It does not log request bodies or write transcripts to a database.</text>
        <text x="91" y="60" fill="#9eb2c7" font-size="13">README.md:104 · missing evidence · missing scope</text>
        <rect x="930" y="25" width="126" height="34" rx="17" fill="#2a2112" stroke="#ffca6a"/><text x="951" y="47" fill="#ffca6a" font-size="12" font-weight="800">NEEDS REVIEW</text>
      </g>
      <g transform="translate(0 196)">
        <rect width="1084" height="86" rx="13" fill="#0d1b2a" stroke="#34475b"/>
        <rect width="5" height="86" rx="3" fill="#ffca6a"/>
        <rect x="20" y="15" width="57" height="23" rx="11" fill="none" stroke="#7890a6"/><text x="33" y="31" fill="#bcd2e8" font-size="11" font-weight="800">CF002</text>
        <text x="91" y="32" fill="#eef7ff" font-size="16" font-weight="700">v1.0 is a hardened reconstruction of the original prototype.</text>
        <text x="91" y="60" fill="#9eb2c7" font-size="13">README.md:110 · missing evidence · missing scope</text>
        <rect x="930" y="25" width="126" height="34" rx="17" fill="#2a2112" stroke="#ffca6a"/><text x="951" y="47" fill="#ffca6a" font-size="12" font-weight="800">NEEDS REVIEW</text>
      </g>
    </g>
    <text x="58" y="602" fill="#9eb2c7" font-size="13">Generated locally · zero model calls · commands not executed · external URLs not fetched</text>
