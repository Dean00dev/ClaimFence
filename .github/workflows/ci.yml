name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: claimfence . --no-color

  action-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./
        id: claimfence
        with:
          paths: README.md docs
          fail-on: warning
          ledger-output: claimfence-ledger.json
          html-output: claimfence-map.html
      - name: Verify composite-action outputs
        env:
          FILES_SCANNED: ${{ steps.claimfence.outputs.files-scanned }}
          CLAIMS_COUNT: ${{ steps.claimfence.outputs.claims-count }}
          EVIDENCE_ANCHORS: ${{ steps.claimfence.outputs.evidence-anchors-count }}
          OUTCOME: ${{ steps.claimfence.outputs.outcome }}
        run: |
          test "$FILES_SCANNED" -gt 0
          test "$CLAIMS_COUNT" -gt 0
          test "$EVIDENCE_ANCHORS" -gt 0
          test "$OUTCOME" = "passed"
          test -s claimfence-ledger.json
          test -s claimfence-map.html
          python -c 'import json; data=json.load(open("claimfence-ledger.json")); assert data["schema_version"] == "1.0"'
      - name: Upload Evidence Map proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: claimfence-evidence-map
          path: |
            claimfence-ledger.json
            claimfence-map.html
