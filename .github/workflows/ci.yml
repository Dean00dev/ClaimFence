name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: claimfence . --no-color

  action-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./
        id: claimfence
        with:
          paths: README.md docs
          fail-on: warning
      - name: Verify composite-action outputs
        env:
          FILES_SCANNED: ${{ steps.claimfence.outputs.files-scanned }}
          OUTCOME: ${{ steps.claimfence.outputs.outcome }}
        run: |
          test "$FILES_SCANNED" -gt 0
          test "$OUTCOME" = "passed"
