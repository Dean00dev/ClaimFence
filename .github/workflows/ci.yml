name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: claimfence . --no-color

  package-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - run: python -m pip wheel . --no-deps --wheel-dir dist
      - run: python -m pip install --no-index --no-deps dist/claimfence-*.whl
      - run: claimfence --version

  action-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Generate comparison ledger
        run: |
          PYTHONPATH=src python -m claimfence README.md docs \
            --root . \
            --fail-on none \
            --ledger-output previous-ledger.json
      - uses: ./
        id: claimfence
        with:
          paths: README.md docs
          fail-on: warning
          compare-ledger: previous-ledger.json
          fail-on-drift: any
          ledger-output: claimfence-ledger.json
          html-output: claimfence-map.html
          drift-output: claimfence-drift.json
      - name: Verify composite-action outputs
        env:
          FILES_SCANNED: ${{ steps.claimfence.outputs.files-scanned }}
          CLAIMS_COUNT: ${{ steps.claimfence.outputs.claims-count }}
          EVIDENCE_ANCHORS: ${{ steps.claimfence.outputs.evidence-anchors-count }}
          OUTCOME: ${{ steps.claimfence.outputs.outcome }}
          DRIFT_CONFIGURED: ${{ steps.claimfence.outputs.drift-configured }}
          DRIFT_EVENTS: ${{ steps.claimfence.outputs.drift-events-count }}
          DRIFT_OUTCOME: ${{ steps.claimfence.outputs.drift-outcome }}
        run: |
          test "$FILES_SCANNED" -gt 0
          test "$CLAIMS_COUNT" -gt 0
          test "$EVIDENCE_ANCHORS" -gt 0
          test "$OUTCOME" = "passed"
          test "$DRIFT_CONFIGURED" = "true"
          test "$DRIFT_EVENTS" -eq 0
          test "$DRIFT_OUTCOME" = "stable"
          test -s claimfence-ledger.json
          test -s claimfence-map.html
          test -s claimfence-drift.json
          python -c 'import json; data=json.load(open("claimfence-ledger.json")); assert data["schema_version"] == "1.0"'
      - name: Upload evidence receipts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: claimfence-evidence-receipts
          path: |
            previous-ledger.json
            claimfence-ledger.json
            claimfence-map.html
            claimfence-drift.json
