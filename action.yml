name: ClaimFence
description: Lint Markdown for evidence-bound assurance claims
author: Dean Egan
branding:
  icon: shield
  color: blue
inputs:
  paths:
    description: Space-separated files or directories to scan
    required: false
    default: .
  fail-on:
    description: Lowest severity that fails the step (info, warning, error, none)
    required: false
    default: warning
  config:
    description: Optional path to a ClaimFence TOML configuration file
    required: false
    default: ""
  baseline:
    description: Optional path to a ClaimFence fingerprint baseline
    required: false
    default: ""
  root:
    description: Repository root for relative paths and local evidence references
    required: false
    default: .
  json-output:
    description: Optional path for a machine-readable JSON report
    required: false
    default: ""
  sarif-output:
    description: Optional path for a SARIF 2.1.0 report
    required: false
    default: ""
  ledger-output:
    description: Optional path for the deterministic claim-and-evidence ledger
    required: false
    default: ""
  html-output:
    description: Optional path for the self-contained interactive evidence map
    required: false
    default: ""
  compare-ledger:
    description: Optional previous claim ledger to compare with the current scan
    required: false
    default: ""
  drift-output:
    description: Optional path for the deterministic evidence-drift JSON receipt
    required: false
    default: ""
  fail-on-drift:
    description: Evidence-drift gate (none, review, or any)
    required: false
    default: none
outputs:
  files-scanned:
    description: Number of Markdown files scanned
    value: ${{ steps.scan.outputs.files-scanned }}
  findings-count:
    description: Number of unbaselined findings
    value: ${{ steps.scan.outputs.findings-count }}
  error-count:
    description: Number of error findings
    value: ${{ steps.scan.outputs.error-count }}
  warning-count:
    description: Number of warning findings
    value: ${{ steps.scan.outputs.warning-count }}
  info-count:
    description: Number of informational findings
    value: ${{ steps.scan.outputs.info-count }}
  suppressed-count:
    description: Number of findings suppressed with a reason
    value: ${{ steps.scan.outputs.suppressed-count }}
  baselined-count:
    description: Number of findings ignored by the baseline
    value: ${{ steps.scan.outputs.baselined-count }}
  claims-count:
    description: Number of distinct assurance claims detected
    value: ${{ steps.scan.outputs.claims-count }}
  linked-claims-count:
    description: Claims with their required lexical context and a concrete anchor
    value: ${{ steps.scan.outputs.linked-claims-count }}
  review-claims-count:
    description: Claims missing context required by at least one matched rule
    value: ${{ steps.scan.outputs.review-claims-count }}
  suppressed-claims-count:
    description: Claims whose missing-context matches were suppressed with a documented reason
    value: ${{ steps.scan.outputs.suppressed-claims-count }}
  evidence-anchors-count:
    description: Distinct commands, URLs, and local references mapped to claims
    value: ${{ steps.scan.outputs.evidence-anchors-count }}
  outcome:
    description: ClaimFence threshold outcome (passed, failed, or report-only)
    value: ${{ steps.scan.outputs.outcome }}
  drift-configured:
    description: Whether a previous evidence ledger was supplied
    value: ${{ steps.scan.outputs.drift-configured }}
  drift-events-count:
    description: Number of deterministic claim and evidence drift events
    value: ${{ steps.scan.outputs.drift-events-count }}
  drift-claims-count:
    description: Number of claims touched by drift events
    value: ${{ steps.scan.outputs.drift-claims-count }}
  drift-review-count:
    description: Number of changed claims requiring review
    value: ${{ steps.scan.outputs.drift-review-count }}
  drift-outcome:
    description: Drift outcome (not-configured, stable, changed, or failed)
    value: ${{ steps.scan.outputs.drift-outcome }}
runs:
  using: composite
  steps:
    - name: Run ClaimFence
      id: scan
      shell: bash
      env:
        CLAIMFENCE_PATHS: ${{ inputs.paths }}
        CLAIMFENCE_FAIL_ON: ${{ inputs.fail-on }}
        CLAIMFENCE_CONFIG: ${{ inputs.config }}
        CLAIMFENCE_BASELINE: ${{ inputs.baseline }}
        CLAIMFENCE_ROOT: ${{ inputs.root }}
        CLAIMFENCE_JSON_OUTPUT: ${{ inputs.json-output }}
        CLAIMFENCE_SARIF_OUTPUT: ${{ inputs.sarif-output }}
        CLAIMFENCE_LEDGER_OUTPUT: ${{ inputs.ledger-output }}
        CLAIMFENCE_HTML_OUTPUT: ${{ inputs.html-output }}
        CLAIMFENCE_COMPARE_LEDGER: ${{ inputs.compare-ledger }}
        CLAIMFENCE_DRIFT_OUTPUT: ${{ inputs.drift-output }}
        CLAIMFENCE_FAIL_ON_DRIFT: ${{ inputs.fail-on-drift }}
        CLAIMFENCE_ACTION_PATH: ${{ github.action_path }}
      run: |
        export PYTHONPATH="$CLAIMFENCE_ACTION_PATH/src${PYTHONPATH:+:$PYTHONPATH}"
        read -r -a claimfence_paths <<< "$CLAIMFENCE_PATHS"
        claimfence_args=(
          --format github
          --fail-on "$CLAIMFENCE_FAIL_ON"
          --root "$CLAIMFENCE_ROOT"
          --fail-on-drift "$CLAIMFENCE_FAIL_ON_DRIFT"
          --github-summary "$GITHUB_STEP_SUMMARY"
          --github-output "$GITHUB_OUTPUT"
        )
        if [[ -n "$CLAIMFENCE_CONFIG" ]]; then
          claimfence_args+=(--config "$CLAIMFENCE_CONFIG")
        fi
        if [[ -n "$CLAIMFENCE_BASELINE" ]]; then
          claimfence_args+=(--baseline "$CLAIMFENCE_BASELINE")
        fi
        if [[ -n "$CLAIMFENCE_JSON_OUTPUT" ]]; then
          claimfence_args+=(--json-output "$CLAIMFENCE_JSON_OUTPUT")
        fi
        if [[ -n "$CLAIMFENCE_SARIF_OUTPUT" ]]; then
          claimfence_args+=(--sarif-output "$CLAIMFENCE_SARIF_OUTPUT")
        fi
        if [[ -n "$CLAIMFENCE_LEDGER_OUTPUT" ]]; then
          claimfence_args+=(--ledger-output "$CLAIMFENCE_LEDGER_OUTPUT")
        fi
        if [[ -n "$CLAIMFENCE_HTML_OUTPUT" ]]; then
          claimfence_args+=(--html-output "$CLAIMFENCE_HTML_OUTPUT")
        fi
        if [[ -n "$CLAIMFENCE_COMPARE_LEDGER" ]]; then
          claimfence_args+=(--compare-ledger "$CLAIMFENCE_COMPARE_LEDGER")
        fi
        if [[ -n "$CLAIMFENCE_DRIFT_OUTPUT" ]]; then
          claimfence_args+=(--drift-output "$CLAIMFENCE_DRIFT_OUTPUT")
        fi
        claimfence_args+=(-- "${claimfence_paths[@]}")
        python -m claimfence "${claimfence_args[@]}"
