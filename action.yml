name: ClaimFence
description: Lint Markdown for evidence-bound assurance claims
author: Dean Egan
branding:
  icon: shield
  color: blue
inputs:
  paths:
    description: Space-separated files or directories to scan
    required: false
    default: .
  fail-on:
    description: Lowest severity that fails the step (info, warning, error, none)
    required: false
    default: warning
  config:
    description: Optional path to a ClaimFence TOML configuration file
    required: false
    default: ""
  baseline:
    description: Optional path to a ClaimFence fingerprint baseline
    required: false
    default: ""
  root:
    description: Repository root for relative paths and local evidence references
    required: false
    default: .
  json-output:
    description: Optional path for a machine-readable JSON report
    required: false
    default: ""
  sarif-output:
    description: Optional path for a SARIF 2.1.0 report
    required: false
    default: ""
outputs:
  files-scanned:
    description: Number of Markdown files scanned
    value: ${{ steps.scan.outputs.files-scanned }}
  findings-count:
    description: Number of unbaselined findings
    value: ${{ steps.scan.outputs.findings-count }}
  error-count:
    description: Number of error findings
    value: ${{ steps.scan.outputs.error-count }}
  warning-count:
    description: Number of warning findings
    value: ${{ steps.scan.outputs.warning-count }}
  info-count:
    description: Number of informational findings
    value: ${{ steps.scan.outputs.info-count }}
  suppressed-count:
    description: Number of findings suppressed with a reason
    value: ${{ steps.scan.outputs.suppressed-count }}
  baselined-count:
    description: Number of findings ignored by the baseline
    value: ${{ steps.scan.outputs.baselined-count }}
  outcome:
    description: ClaimFence threshold outcome (passed, failed, or report-only)
    value: ${{ steps.scan.outputs.outcome }}
runs:
  using: composite
  steps:
    - name: Run ClaimFence
      id: scan
      shell: bash
      env:
        CLAIMFENCE_PATHS: ${{ inputs.paths }}
        CLAIMFENCE_FAIL_ON: ${{ inputs.fail-on }}
        CLAIMFENCE_CONFIG: ${{ inputs.config }}
        CLAIMFENCE_BASELINE: ${{ inputs.baseline }}
        CLAIMFENCE_ROOT: ${{ inputs.root }}
        CLAIMFENCE_JSON_OUTPUT: ${{ inputs.json-output }}
        CLAIMFENCE_SARIF_OUTPUT: ${{ inputs.sarif-output }}
        CLAIMFENCE_ACTION_PATH: ${{ github.action_path }}
      run: |
        export PYTHONPATH="$CLAIMFENCE_ACTION_PATH/src${PYTHONPATH:+:$PYTHONPATH}"
        read -r -a claimfence_paths <<< "$CLAIMFENCE_PATHS"
        claimfence_args=(
          "${claimfence_paths[@]}"
          --format github
          --fail-on "$CLAIMFENCE_FAIL_ON"
          --root "$CLAIMFENCE_ROOT"
          --github-summary "$GITHUB_STEP_SUMMARY"
          --github-output "$GITHUB_OUTPUT"
        )
        if [[ -n "$CLAIMFENCE_CONFIG" ]]; then
          claimfence_args+=(--config "$CLAIMFENCE_CONFIG")
        fi
        if [[ -n "$CLAIMFENCE_BASELINE" ]]; then
          claimfence_args+=(--baseline "$CLAIMFENCE_BASELINE")
        fi
        if [[ -n "$CLAIMFENCE_JSON_OUTPUT" ]]; then
          claimfence_args+=(--json-output "$CLAIMFENCE_JSON_OUTPUT")
        fi
        if [[ -n "$CLAIMFENCE_SARIF_OUTPUT" ]]; then
          claimfence_args+=(--sarif-output "$CLAIMFENCE_SARIF_OUTPUT")
        fi
        python -m claimfence "${claimfence_args[@]}"
